[project]
name = "buildium-mcp"
version = "0.1.2"
description = "MCP gateway for the Buildium Open API — 462 operations via a small tool surface"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
keywords = ["mcp", "buildium", "property-management", "openapi", "llm"]
authors = [{name = "Jared Cure"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp>=4.0,<5.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
buildium-mcp = "buildium_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buildium_mcp"]

[project.urls]
Homepage = "https://github.com/blackwaxxx/Buildium-MCP"
Issues = "https://github.com/blackwaxxx/Buildium-MCP/issues"
Changelog = "https://github.com/blackwaxxx/Buildium-MCP/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The live scripts are __main__ programs, not pytest modules. Naming them here
# keeps `pytest` offline by default — see tests/conftest.py.
python_files = ["test_*.py"]
