name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository. Without this the token's defaults
# apply, and on older repositories those include write access.
permissions:
  contents: read

# Every action is pinned to a full commit, with its version in a comment. A
# tag like @v4 is a pointer the action's owner can move, so a compromised
# action would otherwise run here on the next push. This matters beyond the
# token: CI's bundle job builds the .mcpb that gets released, and release.yml
# can publish to PyPI. To update, resolve the new tag to its commit and bump
# both the SHA and the comment together.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # No credentials are set. tests/conftest.py isolates the suite from any
      # .env, so a pass here means the code passed rather than that a sandbox
      # happened to cooperate.
      - run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build

      # A unit test cannot prove what hatchling actually archived. The spec is
      # 2.7MB and lives inside the package precisely so it ships; if it stops
      # shipping, every pip install fails at startup with "spec not found".
      - name: The wheel must contain the OpenAPI spec
        run: |
          python -m zipfile -l dist/*.whl | grep -q 'buildium_mcp/specs/buildium-openapi.json' \
            || { echo "::error::spec missing from the wheel"; exit 1; }

      # Install outside the checkout, so nothing resolves against the repo.
      - name: Clean-room install must start and self-report
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/python - <<'PY'
          from buildium_mcp import server           # must not need credentials
          health = server.health()
          assert health["deployment_mode"] == "sandbox", health
          assert health["operations_indexed"] == 462, health
          assert "site-packages" in health["spec"], health["spec"]
          assert "site-packages" not in (health["audit_log"] or ""), health["audit_log"]
          assert server.list_tags()["ok"] is True    # spec-only tools work uncredentialed
          print("clean-room OK:", health["spec"])
          PY

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: pip install -e .
      # The manifest is generated from the live tool list, so the package has
      # to be importable here. Packing validates the manifest against the
      # MCPB schema; the smoke test installs and launches the staged bundle
      # exactly the way Claude Desktop does, in a fresh uv environment.
      - run: python mcpb/build.py
      - run: python mcpb/smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: buildium-mcp-mcpb
          path: dist/*.mcpb
